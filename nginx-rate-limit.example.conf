# Example: put the zone declaration in nginx http {} (NOT server {}).
# limit_req_zone $binary_remote_addr zone=twrite_write:10m rate=6r/m;
#
# In the twrite server {} use a dedicated exact-match location for POST /.
# The existing front-controller routing must still run for allowed requests.
# Example for a typical try_files /index.php front controller:
# location = / {
#     limit_req zone=twrite_write burst=6 nodelay;
#     limit_req_status 429;
#     try_files $uri /index.php?$query_string;
# }
#
# IMPORTANT: This example limits ALL requests to /, including GET.
# For production, restrict the limit to POST using a map in http {},
# or implement method-specific controls in the existing routing.
# If behind Cloudflare or another proxy, configure real_ip_header and
# set_real_ip_from only for TRUSTED proxy ranges before using client IP.
# Test with nginx -t and nginx -T; do not paste this blindly.
